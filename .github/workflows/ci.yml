name: CI

# Valida cada pull request y cada push a main. Un cambio solo se integra si
# todos los trabajos terminan en verde (ver AGENTS.md, «Verificación»).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Si llega un commit nuevo a la misma rama, cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Mínimo privilegio: el flujo solo necesita leer el repositorio.
permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  calidad:
    name: Formato, lint, tipos, pruebas unitarias y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # La versión de pnpm sale del campo `packageManager` de package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Formato
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Tipos
        run: pnpm typecheck
      - name: Pruebas unitarias
        run: pnpm test
      - name: Build
        run: pnpm build

  integracion:
    name: Pruebas de integración de la API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Testcontainers levanta su propio PostgreSQL 17 con el Docker del
      # runner, igual que en local: no hace falta declarar un servicio.
      - name: Pruebas de integración
        run: pnpm test:int

  e2e:
    name: Pruebas de extremo a extremo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Instalar navegador
        run: pnpm --filter @portfolio/web exec playwright install --with-deps chromium
      - name: Build
        run: pnpm build
      - name: Pruebas E2E
        run: pnpm test:e2e
      # Si algo falla, el informe con capturas y trazas queda adjunto a la ejecución.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
